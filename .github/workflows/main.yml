name: Build and Release on Tag

on:
  push:
    branches: [ master ]
    tags: v*
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      # Prefer the upstream (beat-forge) stripped refs. If the upstream does not
      # publish the version we need, fall back to the Aeroluna mirror. If we do
      # start from the upstream but the build does not succeed (e.g. its refs are
      # virtualized and break the publicizer), the fallback block below rebuilds
      # from the mirror instead.
      - name: Select stripped references repository
        id: refs
        run: |
          VERSION=$(grep -oP '"gameVersion"\s*:\s*"\K[^"]+' "$GITHUB_WORKSPACE/Source/manifest.json")
          echo "Requested Beat Saber version: $VERSION"
          PRIMARY="beat-forge/beatsaber-stripped"
          FALLBACK="Aeroluna/beatsaber-stripped"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${PRIMARY}/branches/version/${VERSION}")
          if [ "$STATUS" != "200" ]; then
            echo "::warning::${PRIMARY} has no version/${VERSION} branch (HTTP $STATUS); using ${FALLBACK}"
            PRIMARY="$FALLBACK"
          fi
          echo "Primary refs repo: $PRIMARY"
          echo "Fallback refs repo: $FALLBACK"
          echo "primary=${PRIMARY}" >> "$GITHUB_OUTPUT"
          echo "fallback=${FALLBACK}" >> "$GITHUB_OUTPUT"

      - name: Initialize modding environment (primary)
        id: init_primary
        continue-on-error: true
        uses: beat-forge/init-beatsaber@v1
        with:
          token: ${{ github.token }}
          repo: ${{ steps.refs.outputs.primary }}

      - name: Download Mod Dependencies (primary)
        if: steps.init_primary.outcome == 'success'
        uses: Goobwabber/download-beatmods-deps@1.3
        with:
          manifest: ${{ github.workspace }}/Source/manifest.json

      - name: Download Reactive.BeatSaberSDK (primary)
        if: steps.init_primary.outcome == 'success'
        run: |
            echo "📦 Downloading Reactive.BeatSaberSDK..."
            curl -L "https://github.com/reactive-platform/beat-saber-sdk/releases/download/1.0.0/ReactiveUI_1.0.0_Release.zip" -o reactiveui.zip

            # Extract to temp folder to inspect
            mkdir temp_extract
            unzip -o reactiveui.zip -d temp_extract

            # Copy to correct Refs folder structure
            mkdir -p "$GITHUB_WORKSPACE/Refs/Libs"
            mkdir -p "$GITHUB_WORKSPACE/Refs/Plugins"

            echo "Copying Libs..."
            cp -rv temp_extract/Libs/* "$GITHUB_WORKSPACE/Refs/Libs/"
            echo "Copying Plugins..."
            cp -rv temp_extract/Plugins/* "$GITHUB_WORKSPACE/Refs/Plugins/"

            # Clean up
            rm -rf temp_extract reactiveui.zip
            echo "✅ Reactive.BeatSaberSDK extracted to $GITHUB_WORKSPACE/Refs"

      - name: Build (primary)
        id: build
        if: steps.init_primary.outcome == 'success'
        continue-on-error: true
        run: dotnet build --configuration Release -p:DisableZipRelease=false

      # --- Fallback: upstream refs were missing or the primary build failed ---

      - name: Reset References (fallback)
        if: steps.init_primary.outcome != 'success' || steps.build.outcome == 'failure'
        run: |
          echo "::warning::Primary refs (${{ steps.refs.outputs.primary }}) unusable; rebuilding with ${{ steps.refs.outputs.fallback }}"
          rm -rf "$GITHUB_WORKSPACE/Refs"

      - name: Initialize modding environment (fallback)
        if: steps.init_primary.outcome != 'success' || steps.build.outcome == 'failure'
        uses: beat-forge/init-beatsaber@v1
        with:
          token: ${{ github.token }}
          repo: ${{ steps.refs.outputs.fallback }}

      - name: Download Mod Dependencies (fallback)
        if: steps.init_primary.outcome != 'success' || steps.build.outcome == 'failure'
        uses: Goobwabber/download-beatmods-deps@1.3
        with:
          manifest: ${{ github.workspace }}/Source/manifest.json

      - name: Download Reactive.BeatSaberSDK (fallback)
        if: steps.init_primary.outcome != 'success' || steps.build.outcome == 'failure'
        run: |
            echo "📦 Downloading Reactive.BeatSaberSDK..."
            curl -L "https://github.com/reactive-platform/beat-saber-sdk/releases/download/1.0.0/ReactiveUI_1.0.0_Release.zip" -o reactiveui.zip

            # Extract to temp folder to inspect
            mkdir temp_extract
            unzip -o reactiveui.zip -d temp_extract

            # Copy to correct Refs folder structure
            mkdir -p "$GITHUB_WORKSPACE/Refs/Libs"
            mkdir -p "$GITHUB_WORKSPACE/Refs/Plugins"

            echo "Copying Libs..."
            cp -rv temp_extract/Libs/* "$GITHUB_WORKSPACE/Refs/Libs/"
            echo "Copying Plugins..."
            cp -rv temp_extract/Plugins/* "$GITHUB_WORKSPACE/Refs/Plugins/"

            # Clean up
            rm -rf temp_extract reactiveui.zip
            echo "✅ Reactive.BeatSaberSDK extracted to $GITHUB_WORKSPACE/Refs"

      - name: Build (fallback)
        id: build_fallback
        if: steps.init_primary.outcome != 'success' || steps.build.outcome == 'failure'
        run: dotnet build --configuration Release -p:DisableZipRelease=false

      - name: Apply upstream release naming
        id: name
        run: |
          VER=$(grep -oP '"version"\s*:\s*"\K[^"]+' "$GITHUB_WORKSPACE/Source/manifest.json")
          GV=$(grep -oP '"gameVersion"\s*:\s*"\K[^"]+' "$GITHUB_WORKSPACE/Source/manifest.json")
          GV=${GV%.0}
          NAME="BeatLeader-${VER}-bs${GV}+"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ZIPDIR="$GITHUB_WORKSPACE/Source/bin/Release/net48/zip"
          SRC=$(ls "$ZIPDIR"/BeatLeader-*.zip | head -n 1)
          mv "$SRC" "$ZIPDIR/${NAME}.zip"
          echo "Renamed $(basename "$SRC") -> ${NAME}.zip"

      # --- 1.40.2 line (ArrPatch, built from the fork's own 1.40.2 branch) ---
      # Only needed when cutting a release (tag), so it is skipped otherwise.
      - name: Checkout 1.40.2 line
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v3
        with:
          ref: 1.40.2
          path: arrpatch-1.40.2

      - name: Initialize references for 1.40.2
        if: startsWith(github.ref, 'refs/tags/')
        uses: beat-forge/init-beatsaber@v1
        with:
          token: ${{ github.token }}
          repo: Aeroluna/beatsaber-stripped
          version: 1.40.2
          path: ${{ github.workspace }}/refs1402

      - name: Download Mod Dependencies for 1.40.2
        if: startsWith(github.ref, 'refs/tags/')
        uses: Goobwabber/download-beatmods-deps@1.3
        with:
          manifest: ${{ github.workspace }}/arrpatch-1.40.2/Source/manifest.json
          path: ${{ github.workspace }}/refs1402

      - name: Download Reactive.BeatSaberSDK for 1.40.2
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "📦 Downloading Reactive.BeatSaberSDK (1.40.2)..."
          curl -L "https://github.com/reactive-platform/beat-saber-sdk/releases/download/1.0.0/ReactiveUI_1.0.0_Release.zip" -o reactiveui.zip
          mkdir temp_extract
          unzip -o reactiveui.zip -d temp_extract
          mkdir -p "$GITHUB_WORKSPACE/refs1402/Libs"
          mkdir -p "$GITHUB_WORKSPACE/refs1402/Plugins"
          cp -rv temp_extract/Libs/* "$GITHUB_WORKSPACE/refs1402/Libs/"
          cp -rv temp_extract/Plugins/* "$GITHUB_WORKSPACE/refs1402/Plugins/"
          rm -rf temp_extract reactiveui.zip
          echo "✅ Reactive.BeatSaberSDK extracted to $GITHUB_WORKSPACE/refs1402"

      - name: Build 1.40.2
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet build arrpatch-1.40.2/Source/BeatLeader.csproj --configuration Release -p:BeatSaberDir="$GITHUB_WORKSPACE/refs1402" -p:DisableZipRelease=false

      - name: Apply upstream release naming (1.40.2)
        id: name1402
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER=$(grep -oP '"version"\s*:\s*"\K[^"]+' "$GITHUB_WORKSPACE/arrpatch-1.40.2/Source/manifest.json")
          GV=$(grep -oP '"gameVersion"\s*:\s*"\K[^"]+' "$GITHUB_WORKSPACE/arrpatch-1.40.2/Source/manifest.json")
          GV=${GV%.0}
          NAME="BeatLeader-${VER}-bs${GV}+"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ZIPDIR="$GITHUB_WORKSPACE/arrpatch-1.40.2/Source/bin/Release/net48/zip"
          SRC=$(ls "$ZIPDIR"/BeatLeader-*.zip | head -n 1)
          mv "$SRC" "$ZIPDIR/${NAME}.zip"
          echo "Renamed $(basename "$SRC") -> ${NAME}.zip"

      - name: Show Git Status
        run: git status

      - name: Echo Build Info
        run: echo "Artifact=${{ steps.name.outputs.name }} (Assembly=${{ steps.build.outputs.assemblyname || steps.build_fallback.outputs.assemblyname }})"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: Source/bin/Release/net48/zip/${{ steps.name.outputs.name }}.zip

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Source/bin/Release/net48/zip/${{ steps.name.outputs.name }}.zip
            arrpatch-1.40.2/Source/bin/Release/net48/zip/${{ steps.name1402.outputs.name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
